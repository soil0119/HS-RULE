worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        https https;
        http http;
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        client_max_body_size 21m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control no-store always;

        # Only the private Tunnel connector can assert a Cloudflare client address.
        set_real_ip_from 172.30.83.10;
        real_ip_header CF-Connecting-IP;
        real_ip_recursive off;

        # An absent header permits loopback smoke tests; HTTPS Tunnel requests stay HTTPS.
        if ($http_x_forwarded_proto = http) {
            return 308 https://$host$request_uri;
        }

        location = / { try_files /index.html =404; }
        location = /login-page { try_files /login.html =404; }
        location = /upload { try_files /upload.html =404; }
        location ~ ^/(?:index|login|upload)\.html$ { try_files $uri =404; }
        location ~ ^/(?:app\.js|api\.js|i18n\.js|styles\.css|icons\.svg|fonts/(?:SUIT-Variable\.woff2|OFL-1\.1\.txt))$ {
            try_files $uri =404;
        }

        location ~ "^/(?:login|health(?:/live)?|rules|query|uploaded-rules(?:/[0-9a-f]{32})?|upload-regulation|documents/[0-9a-f]{32}(?:/file)?|conflict/|export/(?:pdf|docx))$" {
            set $api_upstream api:8000;
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 125s;
            proxy_send_timeout 125s;
        }

        location / { return 404; }
    }
}
