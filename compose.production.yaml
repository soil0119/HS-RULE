name: hsrule-admin

x-api-image: &api-image
  image: hsrule-api:${HSRULE_IMAGE_TAG:-production}
  build:
    context: .
    dockerfile: deploy/Dockerfile
    target: api

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options:
      max-size: 5m
      max-file: "2"

services:
  db:
    <<: *hardened
    image: ${HSRULE_POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    user: "999:999"
    restart: unless-stopped
    environment:
      POSTGRES_DB: hansungrules
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the private env file}
    volumes:
      - pgdata:/var/lib/postgresql/data
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=32m
      - /var/run/postgresql:rw,nosuid,noexec,size=8m,uid=999,gid=999,mode=0770
    networks: [data]
    shm_size: 128m
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d hansungrules"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  init-uploads:
    <<: [*api-image, *hardened]
    user: "0:0"
    cap_add: [CHOWN, FOWNER]
    network_mode: none
    command: [python, -c, "import os; os.chown('/data/uploads', 65532, 65532); os.chmod('/data/uploads', 0o700)"]
    volumes: [uploads:/data/uploads]
    mem_limit: 32m
    cpus: 0.1
    pids_limit: 16
    restart: "no"

  bootstrap:
    <<: [*api-image, *hardened]
    profiles: [setup]
    command: [python, deploy/bootstrap.py]
    environment:
      DB_ADMIN_URL: ${DB_ADMIN_URL:?Set DB_ADMIN_URL in the private env file}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Set DB_APP_PASSWORD in the private env file}
      UPLOAD_DIR: /data/uploads
    volumes: [uploads:/data/uploads]
    networks: [data]
    tmpfs: ["/tmp:rw,nosuid,noexec,size=32m,uid=65532,gid=65532"]
    depends_on:
      db: {condition: service_healthy}
      init-uploads: {condition: service_completed_successfully}
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 32
    restart: "no"

  api:
    <<: [*api-image, *hardened]
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL for the hsrule_web app role}
      ADMIN_ID: ${ADMIN_ID:?Set ADMIN_ID in the private env file}
      ADMIN_PW: ${ADMIN_PW:?Set ADMIN_PW in the private env file}
      SECRET_KEY: ${SECRET_KEY:?Set a random SECRET_KEY of at least 32 characters}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to the public HTTPS origin}
      UPLOAD_DIR: /data/uploads
    volumes: [uploads:/data/uploads]
    networks: [backend, data]
    tmpfs: ["/tmp:rw,nosuid,noexec,size=128m,uid=65532,gid=65532"]
    depends_on:
      db: {condition: service_healthy}
      init-uploads: {condition: service_completed_successfully}
    mem_limit: 512m
    cpus: 1
    pids_limit: 64
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/live', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    <<: *hardened
    image: hsrule-web:${HSRULE_IMAGE_TAG:-production}
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: web
    restart: unless-stopped
    ports: [127.0.0.1:18081:8080]
    networks:
      backend: {ipv4_address: 172.30.82.10}
      front: {}
    tmpfs: ["/tmp:rw,nosuid,noexec,size=32m,uid=65532,gid=65532"]
    depends_on:
      api: {condition: service_healthy}
    mem_limit: 64m
    cpus: 0.5
    pids_limit: 32
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  tunnel:
    <<: *hardened
    profiles: [tunnel]
    image: ${HSRULE_CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
    user: "1000:1000"
    restart: unless-stopped
    command: [tunnel, --no-autoupdate, run]
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/tunnel-token
    volumes:
      - type: bind
        source: ${HSRULE_TUNNEL_TOKEN_FILE:?Set the absolute private Tunnel token-file path}
        target: /run/secrets/tunnel-token
        read_only: true
        bind: {create_host_path: false}
    networks:
      front: {ipv4_address: 172.30.83.10}
    depends_on:
      web: {condition: service_healthy}
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 32

networks:
  backend:
    ipam:
      config: [{subnet: 172.30.82.0/24}]
  front:
    ipam:
      config: [{subnet: 172.30.83.0/24}]
  data:
    internal: true

volumes:
  pgdata:
  uploads:
