<script type="text/javascript">

	function thisJoPrint(cseq){
		showPopup('/lmxsrv/print/lawDetailPrintView.do?SEQ=20&SEQ_HISTORY=99999&SEQ_CONTENTS='+cseq, 'preview', 700, 304);
	}
	
	function showImg(img , check){
		if(check == 'on'){
			$("#"+img+check).hide(); 
			$("#"+img+"_"+check).hide();
			$("#"+img+"off").show();
			$("#"+img+"_off").show();
			$("tr#"+img).show();
		}else{
			$("#"+img+check).hide();
			$("#"+img+"_"+check).hide();
			$("#"+img+"on").show();
			$("#"+img+"_on").show();
			$("tr#"+img).hide();			
		}
	}
</script>
